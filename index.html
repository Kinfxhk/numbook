<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/tallynote/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The notepad that adds up — every line is a calculation.">
  <meta name="theme-color" content="#FAF9F6">
  <!-- The engine only adds its own viewport tag when this one is missing, so
       declaring it here is what gets viewport-fit=cover in: without it the
       editor runs under the notch and the iOS home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tallynote">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tallynote</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter's engine rewrites the viewport tag when it boots (it drops the
    // flag), so put viewport-fit=cover back once the first frame is up. The
    // app's SafeArea then keeps the header out of the notch and the status bar
    // off the iOS home indicator.
    (function () {
      function fitCover() {
        var meta = document.querySelector('meta[name=viewport]');
        if (meta && meta.content.indexOf('viewport-fit=cover') < 0) {
          meta.content = meta.content + ', viewport-fit=cover';
        }
      }
      window.addEventListener('flutter-first-frame', fitCover);
      window.addEventListener('load', fitCover);
      window.addEventListener('resize', fitCover);
    })();
  </script>
  <script>
    // Tallynote's own worker: Flutter's generated one unregisters itself, and
    // an offline notepad must still open with the network unplugged.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register(new URL('service_worker.js', document.baseURI))
          .catch(function (e) { console.warn('tallynote: no offline cache', e); });
      });
    }
  </script>
</body>
</html>
