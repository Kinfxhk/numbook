name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Write the Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # A release key that never changes, so an update can install over the
          # previous APK. Without it Flutter falls back to the runner's debug key,
          # which is different in every job (learned the hard way on 0.4.2).
          test -n "$KEYSTORE_B64" || { echo 'no signing key in secrets'; exit 1; }
          SIGN="$GITHUB_WORKSPACE/.signing"
          mkdir -p "$SIGN"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$SIGN/release.p12"
          {
            echo "storeFile=$SIGN/release.p12"
            echo "keyAlias=$KEYSTORE_ALIAS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > "$SIGN/key.properties"
          echo "TALLYNOTE_KEY_PROPERTIES=$SIGN/key.properties" >> "$GITHUB_ENV"
      # the universal APK is what a person sideloads; the per-ABI ones are a
      # third of the size for the people who know which phone they have
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      # one line per command: a shell continuation does not survive CRLF
      - name: Checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tallynote-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Attach the APKs to a tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/SHA256SUMS.txt --clobber

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf tallynote-linux.tar.gz -C build/linux/x64/release bundle
      - name: Build .deb
        run: |
          set -e
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          PKG=tallynote_${VER}_amd64
          mkdir -p $PKG/DEBIAN $PKG/usr/lib/tallynote $PKG/usr/bin \
                   $PKG/usr/share/applications $PKG/usr/share/icons/hicolor/512x512/apps
          cp -r build/linux/x64/release/bundle/* $PKG/usr/lib/tallynote/
          ln -s /usr/lib/tallynote/tallynote $PKG/usr/bin/tallynote
          cp packaging/linux/tallynote.desktop $PKG/usr/share/applications/
          cp packaging/linux/tallynote.png $PKG/usr/share/icons/hicolor/512x512/apps/tallynote.png
          INSTALLED=$(du -sk $PKG/usr | cut -f1)
          cat > $PKG/DEBIAN/control <<EOF
          Package: tallynote
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: $INSTALLED
          Depends: libgtk-3-0, libblkid1, liblzma5
          Recommends: xdg-desktop-portal
          Maintainer: KinFx <178037814+Kinfxhk@users.noreply.github.com>
          Homepage: https://github.com/Kinfxhk/tallynote
          Description: Notepad calculator - the notepad that adds up
           Every line is a calculation; answers line up on the decimal point.
           Offline first, no account, no cloud.
          EOF
          dpkg-deb --build --root-owner-group $PKG
      - uses: actions/upload-artifact@v4
        with:
          name: tallynote-linux
          path: |
            tallynote-linux.tar.gz
            tallynote_*_amd64.deb

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Ship the VC++ runtime next to the exe
        run: pwsh packaging/windows/ship-vcrt.ps1
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath tallynote-windows.zip
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: (.+?)\+').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "packaging\windows\tallynote.iss"
          echo "ver=$ver"
      - uses: actions/upload-artifact@v4
        with:
          name: tallynote-windows
          path: |
            tallynote-windows.zip
            build/installer/*.exe

  web:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /tallynote/ --no-web-resources-cdn
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
